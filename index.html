<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Online Wali Kelas</title>
  <!-- Tempel URL deployment Google Apps Script yang berakhiran /exec pada content di bawah ini. -->
  <meta name="apps-script-api-url" content="https://script.google.com/macros/s/AKfycbxE0cYKj6V1tumZoJWpvFY2hoBPJeDNB4I-p1NHDfJsYoxjdKvsB9Ecgwf8ZaMPfZCHMA/exec">
  <style>
    :root {
      --primary: #194d8f;
      --primary-dark: #123a6d;
      --primary-soft: #eaf2ff;
      --surface: #ffffff;
      --background: #f4f7fb;
      --text: #1f2937;
      --muted: #64748b;
      --border: #dbe3ef;
      --success: #16a34a;
      --info: #2563eb;
      --warning: #d6a300;
      --danger: #dc2626;
      --purple: #7c3aed;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .hidden { display: none !important; }

    .app-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 6px 20px rgba(18, 58, 109, 0.18);
    }
    .nav-inner {
      width: min(1180px, calc(100% - 28px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      text-decoration: none;
      min-width: 190px;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }
    .nav-link {
      color: rgba(255, 255, 255, 0.82);
      border: 0;
      background: transparent;
      padding: 9px 11px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 650;
    }
    .nav-link:hover, .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.13);
    }
    .user-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .user-chip {
      text-align: right;
      font-size: 0.82rem;
      line-height: 1.25;
    }
    .user-chip strong { display: block; }
    .user-chip span { color: rgba(255,255,255,.72); }
    .nav-toggle {
      display: none;
      margin-left: auto;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: rgba(255,255,255,.14);
      font-size: 1.25rem;
    }

    .page-shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 52px;
    }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }
    .page-header h1 { margin: 0 0 4px; font-size: clamp(1.55rem, 3vw, 2rem); }
    .page-header p { margin: 0; color: var(--muted); }
    .page-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .grid { display: grid; gap: 18px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

    .card {
      background: var(--surface);
      border: 1px solid rgba(219, 227, 239, 0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-body { padding: 20px; }
    .card-title { margin: 0 0 4px; font-size: 1.08rem; }
    .card-subtitle { margin: 0; color: var(--muted); font-size: .9rem; }

    .summary-card {
      min-height: 112px;
      padding: 18px;
      border-left: 6px solid;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .summary-card span { color: var(--muted); font-weight: 650; }
    .summary-card strong { font-size: 2rem; line-height: 1; }
    .status-h { border-color: var(--success); }
    .status-i { border-color: var(--info); }
    .status-s { border-color: #eab308; }
    .status-a { border-color: var(--danger); }
    .status-week { border-color: var(--purple); }

    .quick-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 105px;
      padding: 18px;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .quick-card:hover, .class-card:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(15,23,42,.12); }
    .quick-card strong { color: #1e3a5f; }
    .quick-card span { color: var(--muted); font-size: .88rem; }
    .quick-icon { font-size: 1.45rem; margin-bottom: 4px; }

    .class-card {
      padding: 20px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .class-card-top { display: flex; justify-content: space-between; gap: 12px; }
    .class-card h3 { margin: 3px 0 8px; font-size: 1.35rem; }
    .class-meta { color: var(--muted); font-size: .9rem; }
    .student-count {
      height: fit-content;
      border-radius: 999px;
      padding: 6px 10px;
      color: #1d4ed8;
      background: #dbeafe;
      font-size: .8rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .class-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }

    .btn {
      min-height: 40px;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 700;
      font-size: .9rem;
      text-decoration: none;
      transition: transform .12s ease, opacity .12s ease, background .12s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { cursor: not-allowed; opacity: .6; transform: none; }
    .btn-primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn-secondary { color: #334155; background: #f1f5f9; border-color: #dbe3ef; }
    .btn-success { color: #fff; background: var(--success); border-color: var(--success); }
    .btn-danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    .btn-warning { color: #4a3500; background: #facc15; border-color: #eab308; }
    .btn-outline { color: var(--primary); background: #fff; border-color: #a9bfdd; }
    .btn-outline-success { color: #15803d; background: #fff; border-color: #86d09e; }
    .btn-outline-danger { color: #b91c1c; background: #fff; border-color: #f0a0a0; }
    .btn-sm { min-height: 34px; padding: 6px 10px; font-size: .82rem; border-radius: 8px; }

    .form-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
    .col-12 { grid-column: span 12; }
    .col-8 { grid-column: span 8; }
    .col-6 { grid-column: span 6; }
    .col-4 { grid-column: span 4; }
    .col-3 { grid-column: span 3; }
    .col-2 { grid-column: span 2; }
    .col-1 { grid-column: span 1; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-weight: 700; font-size: .88rem; color: #334155; }
    .form-control, .form-select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 9px 11px;
      color: var(--text);
      background: #fff;
      outline: none;
    }
    textarea.form-control { resize: vertical; min-height: 90px; }
    .form-control:focus, .form-select:focus {
      border-color: #5c8fd0;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    .form-hint { color: var(--muted); font-size: .8rem; }
    .inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    .inline-form > .form-group { min-width: 180px; flex: 1; }

    .table-card { overflow: hidden; }
    .table-scroll { overflow: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 12px 13px; text-align: left; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
    th { background: #edf2f8; color: #334155; white-space: nowrap; font-size: .85rem; }
    td { font-size: .9rem; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafcff; }
    .actions-cell { display: flex; flex-wrap: wrap; gap: 6px; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .nowrap { white-space: nowrap; }
    .muted { color: var(--muted); }
    .fw-bold { font-weight: 800; }

    .all-recap-filter-card { overflow: visible; }
    .all-recap-show { display:flex; align-items:flex-end; }
    .all-recap-show .btn { width:100%; min-height:42px; white-space:nowrap; }
    .all-recap-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; flex-wrap:wrap; }
    .all-recap-scroll { max-width:100%; }
    .all-recap-table { min-width:max-content; }
    .all-recap-table th, .all-recap-table td { padding:10px 11px; }
    .all-recap-table th:nth-child(1), .all-recap-table td:nth-child(1) { width:54px; }
    .all-recap-table th:nth-child(2), .all-recap-table td:nth-child(2) { min-width:135px; }
    .all-recap-table th:nth-child(3), .all-recap-table td:nth-child(3) { min-width:190px; }
    .all-recap-day { min-width:72px; line-height:1.25; }
    .all-recap-day small { color:#64748b; font-size:.72rem; }
    .all-recap-number { min-width:64px; }
    .all-recap-total td { background:#eaf2fb; border-top:1px solid #cbd5e1; }
    .all-recap-percent { color:#16a34a; white-space:nowrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 800;
    }
    .badge-admin { color: #5b21b6; background: #ede9fe; }
    .badge-teacher { color: #1d4ed8; background: #dbeafe; }
    .badge-h { color: #166534; background: #dcfce7; }
    .badge-i { color: #1d4ed8; background: #dbeafe; }
    .badge-s { color: #854d0e; background: #fef9c3; }
    .badge-a { color: #991b1b; background: #fee2e2; }
    .badge-empty { color: #64748b; background: #f1f5f9; }

    .status-options { display: flex; gap: 5px; min-width: 300px; }
    .status-options input { position: absolute; opacity: 0; pointer-events: none; }
    .status-label {
      min-width: 66px;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      text-align: center;
      background: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: all .14s ease;
    }
    .status-label small { display: block; font-size: .66rem; font-weight: 650; }
    .status-options input[value="H"]:checked + .status-label { color:#fff; background:var(--success); border-color:var(--success); }
    .status-options input[value="I"]:checked + .status-label { color:#fff; background:var(--info); border-color:var(--info); }
    .status-options input[value="S"]:checked + .status-label { color:#2b2500; background:#facc15; border-color:#eab308; }
    .status-options input[value="A"]:checked + .status-label { color:#fff; background:var(--danger); border-color:var(--danger); }

    .report-status {
      display: inline-grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 50%;
      font-size: .78rem;
      font-weight: 900;
    }

    .empty-state {
      text-align: center;
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius);
      padding: 40px 22px;
      color: var(--muted);
      background: #fff;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.16), transparent 36%),
        radial-gradient(circle at bottom right, rgba(15,118,110,.16), transparent 40%),
        var(--background);
    }
    .login-card { width: min(100%, 460px); padding: 30px; }
    .login-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: #fff;
      font-size: 2.1rem;
      background: linear-gradient(135deg, #2563eb, #0f766e);
    }
    .login-title { text-align: center; margin: 16px 0 3px; }
    .login-subtitle { text-align: center; color: var(--muted); margin: 0 0 22px; }
    .demo-box {
      margin-top: 18px;
      border-radius: 12px;
      padding: 13px;
      background: #eef4ff;
      color: #334155;
      font-size: .85rem;
    }
    .api-box {
      margin-top: 14px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      padding: 13px;
      background: #fff;
      color: #334155;
      font-size: .84rem;
    }
    .api-box-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .api-status { display:inline-flex; align-items:center; gap:7px; font-weight:750; }
    .api-dot { width:9px; height:9px; border-radius:50%; background:#94a3b8; }
    .api-dot.ok { background:#16a34a; }
    .api-dot.error { background:#dc2626; }
    .api-url-text { margin-top:7px; color:var(--muted); overflow-wrap:anywhere; }
    .transport-frame { position:fixed; width:1px; height:1px; border:0; opacity:0; pointer-events:none; }

    .toast-stack { position: fixed; top: 78px; right: 16px; z-index: 120; display: grid; gap: 10px; width: min(380px, calc(100% - 32px)); }
    .toast {
      padding: 13px 15px;
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 12px 30px rgba(15,23,42,.2);
      animation: toastIn .22s ease;
    }
    .toast-success { background: #15803d; }
    .toast-error { background: #b91c1c; }
    .toast-info { background: #1d4ed8; }
    @keyframes toastIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: grid;
      place-items: center;
      background: rgba(244,247,251,.76);
      backdrop-filter: blur(3px);
    }
    .loader-box {
      min-width: 170px;
      padding: 22px;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
      font-weight: 750;
      color: #334155;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 10px;
      border: 4px solid #dbeafe;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15,23,42,.5);
    }
    .modal {
      width: min(620px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(15,23,42,.3);
    }
    .modal-head, .modal-foot { padding: 16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .modal-head { border-bottom:1px solid #e5e7eb; }
    .modal-head h2 { margin:0; font-size:1.18rem; }
    .modal-body { padding:20px; }
    .modal-foot { border-top:1px solid #e5e7eb; justify-content:flex-end; }
    .icon-button { width:36px; height:36px; border:0; border-radius:10px; background:#f1f5f9; font-size:1.2rem; }

    .callout {
      padding: 16px 18px;
      border-radius: 14px;
      border-left: 5px solid var(--primary);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .callout-success { border-left-color: var(--success); }
    .section-title { margin: 28px 0 14px; font-size: 1.12rem; }

    @media (max-width: 980px) {
      .grid-5 { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .nav-toggle { display: grid; place-items: center; }
      .nav-inner { flex-wrap: wrap; padding: 10px 0; }
      .nav-links {
        display: none;
        width: 100%;
        order: 3;
        flex-direction: column;
        align-items: stretch;
        padding: 6px 0 10px;
      }
      .nav-links.open { display: flex; }
      .nav-link { width: 100%; text-align: left; }
      .user-menu { margin-left: auto; }
    }
    @media (max-width: 720px) {
      .page-header { flex-direction: column; }
      .page-actions { width: 100%; }
      .page-actions .btn { flex: 1; }
      .grid-5, .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .col-8, .col-6, .col-4, .col-3, .col-2, .col-1 { grid-column: span 12; }
      .user-chip { display: none; }
      .status-options { min-width: 270px; }
      .status-label { min-width: 58px; padding-inline: 6px; }
    }
    @media (max-width: 460px) {
      .page-shell, .nav-inner { width: min(100% - 20px, 1180px); }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .summary-card { min-height: 96px; padding: 14px; }
      .summary-card strong { font-size: 1.6rem; }
      .login-card { padding: 22px; }
    }
    @media print {
      .app-nav, .page-actions, form, .btn, .toast-stack, .loading-overlay, .modal-backdrop { display:none !important; }
      body { background:#fff; }
      .page-shell { width:100%; padding:0; }
      .card { box-shadow:none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toastStack" class="toast-stack"></div>
  <div id="loading" class="loading-overlay hidden">
    <div class="loader-box"><div class="spinner"></div><div id="loadingText">Memuat data...</div></div>
  </div>
  <div id="modalRoot"></div>

  <script>
    'use strict';

    const state = {
      token: localStorage.getItem('absensi_gas_token') || '',
      user: null,
      settings: {},
      today: '',
      currentWeek: '',
      currentMonth: '',
      viewData: null,
      reportData: null,
      initialDashboard: null,
      initialDashboardExpires: 0,
      apiCache: new Map()
    };

    const STATUS_NAMES = { H: 'Hadir', I: 'Izin', S: 'Sakit', A: 'Alpa' };

    // URL backend dibaca langsung dari meta tag apps-script-api-url di bagian <head>.
    // Tidak ada lagi tombol Atur Backend dan tidak memakai localStorage untuk URL backend.
    const API_MESSAGE_SOURCE = 'absensi-gas-api';
    const API_TIMEOUT_MS = 60000;
    const XLSX_LIBRARY_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    const API_CACHE_TTL = {
      dashboard: 20000,
      'classes.list': 30000,
      'users.list': 15000,
      'students.list': 20000,
      'attendance.get': 10000,
      'settings.get': 30000,
      'profile.get': 30000
    };
    const pendingApiRequests = new Map();
    let xlsxLoadPromise = null;
    let backendCheckTimer = null;

    window.addEventListener('message', handleApiMessage);

    document.addEventListener('DOMContentLoaded', init);
    window.addEventListener('hashchange', function () {
      if (state.user) renderRoute();
    });
    document.addEventListener('click', handleGlobalClick);

    async function init() {
      if (!state.token) {
        renderLogin();
        return;
      }
      try {
        setLoading(true, 'Memeriksa sesi...');
        const data = await callServer('bootstrap', {});
        applyBootstrap(data);
        renderShell();
        await renderRoute();
      } catch (error) {
        clearSession();
        renderLogin();
        toast(error.message || 'Sesi berakhir.', 'error');
      } finally {
        setLoading(false);
      }
    }

    function applyBootstrap(data) {
      state.user = data.user;
      state.settings = data.settings || {};
      state.today = data.today;
      state.currentWeek = data.currentWeek;
      state.currentMonth = data.currentMonth;
      state.initialDashboard = data.dashboard || null;
      state.initialDashboardExpires = data.dashboard ? Date.now() + API_CACHE_TTL.dashboard : 0;
      if (data.dashboard) cacheApiData('dashboard', {}, data.dashboard, API_CACHE_TTL.dashboard);
    }

    function callServer(action, payload, options) {
      const apiUrl = getApiUrl();
      if (!apiUrl) {
        return Promise.reject(new Error('URL Web App belum diisi atau tidak valid. Tempel alamat deployment Apps Script yang berakhiran /exec pada meta apps-script-api-url di index.html.'));
      }

      const requestPayload = payload || {};
      const settings = options || {};
      const ttl = API_CACHE_TTL[action] || 0;
      const cacheKey = apiCacheKey(action, requestPayload);
      if (ttl && !settings.force) {
        const cached = state.apiCache.get(cacheKey);
        if (cached && cached.data && cached.expires > Date.now()) {
          return Promise.resolve(cached.data);
        }
        if (cached && cached.promise) return cached.promise;
      }

      const requestPromise = callExternalApi(apiUrl, {
        action: action,
        token: state.token,
        payload: requestPayload
      }).then(function (response) {
        if (!response || response.ok !== true) {
          const message = response && response.message ? response.message : 'Respons server tidak valid.';
          if (/Sesi|masuk kembali/i.test(message)) {
            clearSession();
            renderLogin();
          }
          throw new Error(message);
        }

        const data = response.data || {};
        if (ttl) {
          cacheApiData(action, requestPayload, data, ttl);
        } else if (!['ping', 'login', 'logout', 'bootstrap'].includes(action)) {
          clearApiCache();
        }
        return data;
      }).catch(function (error) {
        if (ttl) state.apiCache.delete(cacheKey);
        throw error;
      });

      if (ttl) {
        state.apiCache.set(cacheKey, { promise: requestPromise, expires: Date.now() + ttl });
      }
      return requestPromise;
    }

    function apiCacheKey(action, payload) {
      return action + '|' + JSON.stringify(payload || {});
    }

    function cacheApiData(action, payload, data, ttl) {
      state.apiCache.set(apiCacheKey(action, payload), {
        data: data,
        expires: Date.now() + (ttl || API_CACHE_TTL[action] || 0)
      });
    }

    function clearApiCache() {
      state.apiCache.clear();
      state.initialDashboard = null;
      state.initialDashboardExpires = 0;
    }

    function getApiUrl() {
      const meta = document.querySelector('meta[name="apps-script-api-url"]');
      return normalizeApiUrl(meta ? meta.getAttribute('content') : '');
    }

    function normalizeApiUrl(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      try {
        const url = new URL(text);
        if (url.protocol !== 'https:' || url.hostname !== 'script.google.com') return '';
        if (!/\/macros\/s\/[^/]+\/exec$/.test(url.pathname)) return '';
        url.search = '';
        url.hash = '';
        return url.toString().replace(/\/$/, '');
      } catch (ignore) {
        return '';
      }
    }


    async function testBackendConnection() {
      const apiUrl = getApiUrl();
      updateApiStatus('checking', 'Memeriksa koneksi...');
      if (!apiUrl) {
        updateApiStatus('error', 'URL backend belum diisi di index.html');
        return;
      }
      try {
        const response = await callExternalApi(apiUrl, { action: 'ping', token: '', payload: {} });
        if (!response || response.ok !== true) throw new Error(response && response.message ? response.message : 'Respons tidak valid.');
        updateApiStatus('ok', 'Backend terhubung');
      } catch (error) {
        updateApiStatus('error', error.message || 'Backend tidak dapat dihubungi');
      }
    }

    function updateApiStatus(status, text) {
      const dot = document.getElementById('apiStatusDot');
      const label = document.getElementById('apiStatusText');
      if (dot) dot.className = 'api-dot' + (status === 'ok' ? ' ok' : status === 'error' ? ' error' : '');
      if (label) label.textContent = text || '';
    }

    function callExternalApi(apiUrl, request) {
      return new Promise(function (resolve, reject) {
        const frontendOrigin = window.location.origin;
        if (!frontendOrigin || frontendOrigin === 'null') {
          reject(new Error('Buka index.html melalui hosting web/HTTPS atau server lokal, bukan langsung dengan file://.'));
          return;
        }

        const requestId = 'req_' + Date.now() + '_' + randomToken(16);
        const callbackToken = randomToken(32);
        const frameName = 'gas_transport_' + requestId.replace(/[^a-zA-Z0-9_]/g, '_');
        const iframe = document.createElement('iframe');
        iframe.name = frameName;
        iframe.className = 'transport-frame';
        iframe.setAttribute('aria-hidden', 'true');
        iframe.referrerPolicy = 'no-referrer';

        const form = document.createElement('form');
        form.method = 'POST';
        form.acceptCharset = 'UTF-8';
        form.action = apiUrl;
        form.target = frameName;
        form.style.display = 'none';

        appendHiddenField(form, 'request_id', requestId);
        appendHiddenField(form, 'callback_token', callbackToken);
        appendHiddenField(form, 'origin', frontendOrigin);
        appendHiddenField(form, 'request', JSON.stringify(request));

        const timeoutId = window.setTimeout(function () {
          cleanupApiRequest(requestId);
          reject(new Error('Backend tidak mengirim respons. Deploy Code.gs sebagai versi baru, pilih Execute as: Me dan Who has access: Anyone, lalu pastikan URL di index.html berakhiran /exec.'));
        }, API_TIMEOUT_MS);

        pendingApiRequests.set(requestId, {
          resolve: resolve,
          reject: reject,
          timeoutId: timeoutId,
          iframe: iframe,
          form: form,
          callbackToken: callbackToken
        });

        document.body.appendChild(iframe);
        document.body.appendChild(form);
        form.submit();
      });
    }

    function randomToken(byteLength) {
      const bytes = new Uint8Array(byteLength || 16);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes, function (value) {
          return value.toString(16).padStart(2, '0');
        }).join('');
      }
      return Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }

    function appendHiddenField(form, name, value) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = value;
      form.appendChild(input);
    }

    function handleApiMessage(event) {
      let host = '';
      try { host = new URL(event.origin).hostname; } catch (ignore) { return; }
      const trustedGoogleOrigin = host === 'script.google.com' ||
        host === 'script.googleusercontent.com' ||
        host.endsWith('.googleusercontent.com');
      if (!trustedGoogleOrigin) return;

      const message = event.data;
      if (!message || message.source !== API_MESSAGE_SOURCE || !message.requestId) return;
      const pending = pendingApiRequests.get(message.requestId);
      if (!pending) return;

      // Apps Script HtmlService memakai sandbox IFRAME bertingkat. Sumber pesan
      // dapat berasal dari iframe sandbox Google, bukan iframe transport terluar.
      // Verifikasi dilakukan memakai origin Google + requestId + callbackToken.
      if (!message.callbackToken || message.callbackToken !== pending.callbackToken) return;

      cleanupApiRequest(message.requestId);
      pending.resolve(message.response);
    }

    function cleanupApiRequest(requestId) {
      const pending = pendingApiRequests.get(requestId);
      if (!pending) return;
      window.clearTimeout(pending.timeoutId);
      pendingApiRequests.delete(requestId);
      if (pending.form && pending.form.parentNode) pending.form.remove();
      if (pending.iframe && pending.iframe.parentNode) pending.iframe.remove();
    }

      return { name: name, params: params };

    function dateRangeClient(start, end) {
      const result = [];
      if (!start || !end) return result;
      const current = new Date(start + 'T12:00:00');
      const last = new Date(end + 'T12:00:00');
      while (current.getTime() <= last.getTime()) {
        const y = current.getFullYear();
        const m = String(current.getMonth() + 1).padStart(2, '0');
        const d = String(current.getDate()).padStart(2, '0');
        result.push(y + '-' + m + '-' + d);
        current.setDate(current.getDate() + 1);
      }
      return result;
    }

    function shortDate(value) {
      const parts = String(value || '').split('-');
      return parts.length === 3 ? parts[2] + '/' + parts[1] : value;
    }

    function buildAllClassesMatrix(period, selectedClassId) {
      const dates = dateRangeClient(period.start, period.end);
      const allClasses = (period.rows && period.rows.data) ? period.rows.data : [];
      const classes = selectedClassId
        ? allClasses.filter(function (row) { return row.id === selectedClassId; })
        : allClasses.slice();
      const allowed = new Set(classes.map(function (row) { return row.id; }));
      const dailyRows = ((period.daily && period.daily.data) || []).filter(function (row) {
        return allowed.has(row.class_id);
      });
      const dailyMap = {};
      const dayNames = {};
      dailyRows.forEach(function (row) {
        dailyMap[row.class_id + '|' + row.date] = row;
        if (!dayNames[row.date]) dayNames[row.date] = row.day_name;
      });

      const dayNamesFallback = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      dates.forEach(function (dateText) {
        if (!dayNames[dateText]) dayNames[dateText] = dayNamesFallback[new Date(dateText + 'T12:00:00').getDay()];
      });

      const rows = classes.map(function (classRow) {
        const dayValues = [];
        const counts = { H: 0, I: 0, S: 0, A: 0, recorded: 0 };
        dates.forEach(function (dateText) {
          const day = dailyMap[classRow.id + '|' + dateText] || { H: 0, I: 0, S: 0, A: 0, recorded: 0, unrecorded: Number(classRow.student_count || 0) };
          dayValues.push(day);
          counts.H += Number(day.H || 0);
          counts.I += Number(day.I || 0);
          counts.S += Number(day.S || 0);
          counts.A += Number(day.A || 0);
          counts.recorded += Number(day.recorded || 0);
        });
        const denominator = counts.H + counts.I + counts.S + counts.A;
        return {
          id: classRow.id,
          name: classRow.name,
          teacher_name: classRow.teacher_name || '-',
          student_count: Number(classRow.student_count || 0),
          days: dayValues,
          H: counts.H,
          I: counts.I,
          S: counts.S,
          A: counts.A,
          recorded: counts.recorded,
          percentage: denominator > 0 ? (counts.H / denominator) * 100 : null
        };
      });

      const dayTotals = dates.map(function (dateText, dayIndex) {
        return rows.reduce(function (acc, row) {
          const day = row.days[dayIndex];
          acc.H += Number(day.H || 0);
          acc.recorded += Number(day.recorded || 0);
          return acc;
        }, { H: 0, recorded: 0 });
      });
      const totals = rows.reduce(function (acc, row) {
        acc.H += row.H;
        acc.I += row.I;
        acc.S += row.S;
        acc.A += row.A;
        return acc;
      }, { H: 0, I: 0, S: 0, A: 0 });
      const denominator = totals.H + totals.I + totals.S + totals.A;
      totals.percentage = denominator > 0 ? (totals.H / denominator) * 100 : null;

      return { start: period.start, end: period.end, dates: dates, dayNames: dayNames, rows: rows, dayTotals: dayTotals, totals: totals };
    }

    function ensureXlsxLoaded() {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      if (xlsxLoadPromise) return xlsxLoadPromise;

      xlsxLoadPromise = new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        script.src = XLSX_LIBRARY_URL;
        script.async = true;
        script.onload = function () {
          if (window.XLSX) resolve(window.XLSX);
          else reject(new Error('Library Excel gagal diinisialisasi.'));
        };
        script.onerror = function () {
          xlsxLoadPromise = null;
          reject(new Error('Library Excel gagal dimuat. Periksa koneksi internet lalu coba lagi.'));
        };
        document.head.appendChild(script);
      });
      return xlsxLoadPromise;
    }

    async function parseTableFile(file) {
      await ensureXlsxLoaded();
      const buffer = await file.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: 'array' });
      if (!workbook.SheetNames.length) throw new Error('File tidak memiliki lembar data.');
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
      if (!rows.length) throw new Error('File kosong atau tidak memiliki baris data.');
      return rows;
    }

    async function downloadExcel(rows, filename, sheetName, options) {
      try {
        setLoading(true, 'Menyiapkan file Excel...');
        await ensureXlsxLoaded();
        options = options || {};
        const worksheet = XLSX.utils.aoa_to_sheet(rows);
        const columnCount = rows.reduce(function (max, row) { return Math.max(max, row.length); }, 0);
        worksheet['!cols'] = options.widths
          ? options.widths.map(function (width) { return { wch: width }; })
          : Array.from({ length: columnCount }, function (_, index) {
              const maxLength = rows.reduce(function (max, row) {
                const value = row[index] === undefined || row[index] === null ? '' : String(row[index]);
                return Math.max(max, value.length);
              }, index === 1 ? 18 : 10);
              return { wch: Math.min(Math.max(maxLength + 2, 10), 32) };
            });

        if (options.mergeTitle && columnCount > 1) {
          worksheet['!merges'] = worksheet['!merges'] || [];
          worksheet['!merges'].push({ s: { r: 0, c: 0 }, e: { r: 0, c: columnCount - 1 } });
        }
        if (options.headerRow && rows.length >= options.headerRow) {
          const headerIndex = options.headerRow - 1;
          const lastDataRow = options.filterEndRow ? Math.max(headerIndex, options.filterEndRow - 1) : Math.max(headerIndex, rows.length - 1);
          worksheet['!autofilter'] = {
            ref: XLSX.utils.encode_range({ s: { r: headerIndex, c: 0 }, e: { r: lastDataRow, c: columnCount - 1 } })
          };
        }
        if (options.percentColumn) {
          const percentColIndex = options.percentColumn - 1;
          for (let rowIndex = (options.headerRow || 1); rowIndex < rows.length; rowIndex += 1) {
            const ref = XLSX.utils.encode_cell({ r: rowIndex, c: percentColIndex });
            if (worksheet[ref] && typeof worksheet[ref].v === 'number') worksheet[ref].z = '0.00%';
          }
        }

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, String(sheetName || 'Laporan').slice(0, 31));
        XLSX.writeFile(workbook, filename);
      } catch (error) {
        toast(error.message || 'File Excel gagal dibuat.', 'error');
      } finally {
        setLoading(false);
      }
    }

    function downloadCsv(rows, filename) {
      const text = rows.map(function (row) {
        return row.map(function (value) {
          const cell = value === undefined || value === null ? '' : String(value);
          return /[",\n]/.test(cell) ? '"' + cell.replace(/"/g, '""') + '"' : cell;
        }).join(',');
      }).join('\r\n');
      const blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    document.addEventListener('submit', function (event) {
      const form = event.target.closest('.all-report-filter');
      if (!form) return;
      event.preventDefault();
      const formData = new FormData(form);
      const dateFrom = formData.get('dateFrom');
      const dateTo = formData.get('dateTo');
      const classId = formData.get('classId') || '';
      if (!dateFrom || !dateTo) { toast('Isi tanggal mulai dan tanggal selesai.', 'error'); return; }
      if (dateFrom > dateTo) { toast('Tanggal mulai tidak boleh melewati tanggal selesai.', 'error'); return; }
      navigate('all-reports', { dateFrom: dateFrom, dateTo: dateTo, classId: classId });
    });

    function formatDate(value) {
      if (!value) return '-';
      const parts = String(value).split('-');
      return parts.length === 3 ? parts[2] + '-' + parts[1] + '-' + parts[0] : value;
    }
    function safeFilename(value) { return String(value || '').replace(/[\\/:*?"<>|\s]+/g, '_'); }
    function escapeHtml(value) { return String(value === undefined || value === null ? '' : value).replace(/[&<>'"]/g, function (char) { return ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[char]; }); }
    function escapeAttr(value) { return escapeHtml(value); }

    function setLoading(show, text) {
      const loading = document.getElementById('loading');
      document.getElementById('loadingText').textContent = text || 'Memuat data...';
      loading.classList.toggle('hidden', !show);
    }

    function toast(message, type) {
      if (!message) return;
      const node = document.createElement('div');
      node.className = 'toast toast-' + (type || 'info');
      node.textContent = message;
      document.getElementById('toastStack').appendChild(node);
      setTimeout(function () { node.remove(); }, 4200);
    }
  </script>
</body>
</html>
